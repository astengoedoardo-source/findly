<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Findly — Trova il meglio</title>

  <meta
    name="description"
    content="Findly cerca, confronta e trova ciò che fa per te."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">
      find<span>ly</span>
    </div>

    <div class="demo-badge">
      V4
    </div>

  </header>


  <!-- MAIN -->

  <main>

    <!-- HERO -->

    <section class="hero">

      <p class="eyebrow">
        SMART DISCOVERY
      </p>

      <h1>
        Dimmi cosa cerchi.<br>
        <span>Findly trova il meglio.</span>
      </h1>

      <p class="subtitle">
        Prodotti, moda, tecnologia, film, libri, musica,
        viaggi e luoghi. Descrivi quello che cerchi.
        Findly farà il resto.
      </p>

    </section>


    <!-- SEARCH -->

    <section class="search-card">

      <!-- REQUEST -->

      <div class="field">

        <label for="request">
          Cosa stai cercando?
        </label>

        <textarea
          id="request"
          placeholder="Es. Cerco una maglietta Ralph Lauren usata, in ottime condizioni, sotto i 50€..."
        ></textarea>

      </div>


      <!-- CATEGORY -->

      <div class="field">

        <label>
          Cosa stai cercando?
        </label>

        <div
          id="categories"
          class="category-grid"
        >

          <button
            type="button"
            class="category active"
            data-category="products"
          >
            <span>🛍️</span>
            Prodotti
          </button>


          <button
            type="button"
            class="category"
            data-category="fashion"
          >
            <span>👕</span>
            Moda
          </button>


          <button
            type="button"
            class="category"
            data-category="tech"
          >
            <span>💻</span>
            Tecnologia
          </button>


          <button
            type="button"
            class="category"
            data-category="auto"
          >
            <span>🚗</span>
            Auto
          </button>


          <button
            type="button"
            class="category"
            data-category="home"
          >
            <span>🏠</span>
            Casa
          </button>


          <button
            type="button"
            class="category"
            data-category="movies"
          >
            <span>🎬</span>
            Film & Serie
          </button>


          <button
            type="button"
            class="category"
            data-category="books"
          >
            <span>📚</span>
            Libri
          </button>


          <button
            type="button"
            class="category"
            data-category="music"
          >
            <span>🎵</span>
            Musica
          </button>


          <button
            type="button"
            class="category"
            data-category="travel"
          >
            <span>✈️</span>
            Viaggi
          </button>


          <button
            type="button"
            class="category"
            data-category="places"
          >
            <span>📍</span>
            Luoghi & Esperienze
          </button>


          <button
            type="button"
            class="category"
            data-category="other"
          >
            <span>🔎</span>
            Altro
          </button>

        </div>

      </div>


      <!-- DYNAMIC FILTERS -->

      <div
        id="dynamicFilters"
        class="dynamic-filters"
      >

        <div class="field">

          <label for="budget">
            Budget
          </label>

          <select id="budget">

            <option value="any">
              Qualsiasi
            </option>

            <option value="under50">
              Meno di €50
            </option>

            <option value="under100">
              Meno di €100
            </option>

            <option value="100-300">
              €100 – €300
            </option>

            <option value="300-700">
              €300 – €700
            </option>

            <option value="700-1500">
              €700 – €1.500
            </option>

            <option value="1500plus">
              Oltre €1.500
            </option>

          </select>

        </div>

      </div>


      <!-- PRIORITY -->

      <div class="field">

        <label>
          Cosa conta di più?
        </label>

        <div class="priorities">

          <button
            type="button"
            class="priority active"
            data-value="value"
          >
            <span>◆</span>
            Qualità/prezzo
          </button>


          <button
            type="button"
            class="priority"
            data-value="price"
          >
            <span>€</span>
            Prezzo
          </button>


          <button
            type="button"
            class="priority"
            data-value="quality"
          >
            <span>★</span>
            Qualità
          </button>


          <button
            type="button"
            class="priority"
            data-value="reviews"
          >
            <span>♥</span>
            Recensioni
          </button>

        </div>

      </div>


      <!-- SEARCH BUTTON -->

      <button
        id="findButton"
        class="find-button"
        type="button"
      >

        <span>
          🔎
        </span>

        Trova per me

        <span>
          →
        </span>

      </button>

    </section>


    <!-- RESULTS -->

    <section
      id="results"
      class="results hidden"
    >

      <div class="results-header">

        <div>

          <p class="eyebrow">
            FINDLY MATCH
          </p>

          <h2>
            Abbiamo trovato queste opzioni.
          </h2>

        </div>


        <div
          id="matchCount"
          class="match-count"
        >
          0 risultati
        </div>

      </div>


      <!-- RESULT FILTERS -->

      <div
        id="resultFilters"
        class="result-filters"
      >

        <button
          class="result-filter active"
          data-sort="best"
        >
          🏆 Migliore
        </button>

        <button
          class="result-filter"
          data-sort="price"
        >
          💰 Prezzo
        </button>

        <button
          class="result-filter"
          data-sort="quality"
        >
          ⭐ Qualità
        </button>

        <button
          class="result-filter"
          data-sort="reviews"
        >
          ♥ Recensioni
        </button>

      </div>


      <!-- RESULTS -->

      <div
        id="recommendations"
        class="recommendations"
      ></div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>

    <p>
      Findly · Smart Discovery
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
